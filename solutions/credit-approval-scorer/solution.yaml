solution:
  name: "Australian Credit Approval Scorer"
  id: "credit-approval-scorer"
  type: "scoring"
  category: "ml"
  version: "1.0.0"
  description: "Predicts credit approval probability using anonymised Australian credit data"

owner: "Chapter Platform Team"
risk_tier: "production_internal"

dataset:
  source: "UCI Machine Learning Repository — Statlog (Australian Credit Approval)"
  origin: "Australia"
  records: 690
  features: 14
  target: "A15"
  protected_attributes: "unknown (anonymised)"
  small_sample: true

model:
  type: "LogisticRegression"
  framework: "scikit-learn"
  explainability: "SHAP"
  training_split: 0.7

guardrails:
  proxy_discrimination:
    method: "subgroup_approval_rate_analysis"
    flag_threshold: 0.15
    human_review_required: true
  calibration:
    brier_score_threshold: 0.25
    hosmer_lemeshow_p: 0.05
  small_sample:
    bootstrap_iterations: 1000
    ci_level: 0.95
    ci_width_warning: 0.20
  explainability:
    method: "SHAP"
    coverage: 1.0
    interpretability_warning: true

evaluation:
  holdout_size: 0.3
  metrics:
    - name: "auc_roc"
      threshold: 0.70
      report_ci: true
    - name: "gini"
      threshold: 0.40
      report_ci: true
    - name: "brier_score"
      threshold: 0.25
      direction: "lower_is_better"
    - name: "hosmer_lemeshow_p"
      threshold: 0.05
    - name: "subgroup_approval_variance"
      threshold: 0.15
      direction: "lower_is_better"
    - name: "shap_coverage"
      threshold: 1.0
    - name: "ci_width_auc"
      report_only: true

compliance:
  deployment_gate: true
  evidence_export: true
  gates:
    - "registration"
    - "evaluation_harness"
    - "proxy_discrimination_review"
    - "calibration_validation"
    - "small_sample_uncertainty"
    - "explainability_validation"
    - "audit_trail"
    - "golden_dataset_signoff"

monitoring:
  frequency: "monthly"
  note: "Small dataset limits production drift monitoring — PSI unreliable below 1000 records"
