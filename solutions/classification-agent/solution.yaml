name: Risk Classification Agent
id: classification-agent
description: >
  Classifies incoming items into risk categories based on content analysis.
  Produces a structured classification with confidence score, reasoning,
  and recommended action.
version: "1.0.0"
owner: "Operational Risk Squad"
type: endpoint
endpoint:
  url: "http://localhost:8002/classify"
  method: POST
  timeout_ms: 15000
risk_tier: production_internal

guardrails:
  - scope_adherence
  - pii_scan
  - bias
  - toxicity

evaluation:
  golden_dataset: golden_dataset/dataset.json
  metrics:
    - accuracy
    - bias
    - consistency
  thresholds: production_internal

tracing:
  contract_version: "1.0"
  emits:
    - llm_call
    - reasoning_step
  format: opentelemetry

compliance:
  deployment_gate: true
  evidence_export: true
