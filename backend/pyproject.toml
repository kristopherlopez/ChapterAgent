[project]
name = "chapter-agent-backend"
version = "1.0.0"
description = "AI governance platform backend — Chapter Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "openai>=1.60",
    "chromadb>=0.6",
    "deepeval>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pymupdf>=1.25",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
